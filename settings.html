<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Metronome settings</title><link rel="stylesheet" href="style.css"></head><body class="settings-body">
<header><span class="brand"><span class="brand-mark">⌁</span> METRONOME</span><span class="tag">SETTINGS</span></header>
<button id="visibility" class="primary" disabled>Show metronome</button>
<form id="settings">
<fieldset><legend>TEMPO RANGE</legend><div class="two-columns"><label>Minimum BPM<input id="min" type="number" min="20" max="399" required></label><label>Maximum BPM<input id="max" type="number" min="21" max="400" required></label></div></fieldset>
<fieldset><legend>SOUND</legend><label>Beat subdivision<span class="subdivision-control" data-subdivision="quarter"><select id="subdivision"><option value="quarter">♩  Quarter notes</option><option value="eighth">♪  Eighth notes</option><option value="sixteenth">𝅘𝅥𝅯  Sixteenth notes</option><option value="swing">♪·  Swung eighths</option></select></span></label><label>Click voice<select id="sound"><option value="wood">Wood · warm knock</option><option value="tick">Tick · crisp click</option><option value="soft">Soft · gentle tone</option></select></label><label class="range-heading" for="volume">Volume <output id="volume-value"></output></label><input id="volume" type="range" min="0" max="100"><label>Accent first beat<select id="beats"><option value="0">Off · every beat the same</option><option value="2">Every 2 beats</option><option value="3">Every 3 beats</option><option value="4">Every 4 beats</option><option value="5">Every 5 beats</option><option value="6">Every 6 beats</option><option value="7">Every 7 beats</option><option value="8">Every 8 beats</option></select></label></fieldset>
<fieldset><legend>WINDOW</legend><label>Size<select id="size"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label><label class="range-heading" for="opacity">Control opacity <output id="opacity-value"></output></label><input id="opacity" type="range" min="30" max="100"><p class="hint">Chrome cannot make the desktop behind this window visible. This fades the controls.</p></fieldset>
</form><p id="message" class="hint" role="status">Changes save automatically.</p><footer>Shortcuts work while the metronome is focused.<br>Space toggle · ↑ ↓ 1 BPM · ← → 5 BPM<br>T tap tempo · Esc hide and stop</footer><script type="module" src="settings.js"></script></body></html>
